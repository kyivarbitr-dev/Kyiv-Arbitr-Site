name: Лоти → Telegram (щоранку ~8:50)

on:
  schedule:
    # 8:50 і 9:20 за Києвом (влітку UTC+3: 05:50 і 06:20; взимку UTC+2: 06:50 і 07:20).
    # GitHub часто запускає розклад із запізненням до години, тому кілька спроб і вікно 08:30–12:00.
    # Скрипт публікує лише раз на день: наступні запуски того ж дня бачать lastRun і пропускають.
    - cron: "50 5 * * *"
    - cron: "20 6 * * *"
    - cron: "50 6 * * *"
    - cron: "20 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: telegram-lots
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Опублікувати добірку лотів у Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://kyivarbitr.com.ua
          TG_KYIV_WINDOW: "08:30-12:00"
        run: python scripts/tg_post.py

      - name: Зберегти перелік опублікованих лотів
        run: |
          git config user.name  "prozorro-map-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f data/tg-posted.json ]; then git add data/tg-posted.json; fi
          if git diff --cached --quiet; then
            echo "Змін немає"
          else
            git commit -m "Telegram: опубліковані лоти"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
          fi
