name: Новини сайту → Telegram

on:
  push:
    branches: [main]
    paths: ["news/news.json"]
  # Публікацію в Telegram запускає Cloudflare Worker (workers/tg-scheduler) кожні 2 години
  # о 08, 10, 12, 14, 16, 18 і 20 за Києвом — по одній новині за раз.
  # Розклад GitHub (schedule) не використовуємо: він затримує запуски на години.
  # Push у news.json лише оновлює сторінки новин, RSS і sitemap, у Telegram нічого не надсилає.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: telegram-news
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Сторінки новин, RSS і sitemap
        id: build
        run: |
          python scripts/build_news.py
          git config user.name  "prozorro-map-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news/*.html news/rss.xml sitemap.xml
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Новини: сторінки, RSS і sitemap"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Зачекати, поки Cloudflare опублікує нову версію сайту
        if: github.event_name != 'push' && steps.build.outputs.changed == 'true'
        run: sleep 150

      - name: Опублікувати нові новини в Telegram
        if: github.event_name != 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://kyivarbitr.com.ua
        run: python scripts/tg_news.py

      - name: Зберегти перелік опублікованих новин
        if: github.event_name != 'push'
        run: |
          git config user.name  "prozorro-map-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f data/tg-news-posted.json ]; then git add data/tg-news-posted.json; fi
          if git diff --cached --quiet; then
            echo "Змін немає"
          else
            git commit -m "Telegram: опубліковані новини"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
          fi
