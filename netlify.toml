[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Розділ «Інформер» прибрано: старі посилання ведуть на «Корисні посилання»
[[redirects]]
  from = "/info.html"
  to = "/links.html"
  status = 301
